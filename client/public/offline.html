<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; color: #f5f5f4; background: #0b0b0b; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); padding: 42px; border: 1px solid #5b4a20; background: #151515; }
      p { color: #c9c4b7; line-height: 1.7; }
      h1 { margin: 0; color: #d4af37; font-family: Georgia, serif; font-weight: 400; }
      a { display: inline-block; margin-top: 14px; padding: 13px 18px; color: #0b0b0b; background: #d4af37; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid white; outline-offset: 4px; }
      @media (max-width: 480px) { main { padding: 28px 22px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline.</h1>
      <p>The shop website can’t be reached right now. Check your connection and try again. No booking details are saved on this device.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
